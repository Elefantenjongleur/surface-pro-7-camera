# Desktop cameras need session device permissions before first enumeration.
# Do not grant device access here or change other hardware monitors.
wireplumber.components = [
  {
    name = sp7/libcamera-seat-monitor.lua
    type = script/lua
    provides = custom.sp7-libcamera
    requires = [ support.logind,
                 support.export-core,
                 pw.client-device,
                 support.standard-event-source,
                 hooks.monitor.libcamera-create-device,
                 hooks.monitor.libcamera-create-node ]
    wants = [ hooks.monitor.libcamera-name-device,
              hooks.monitor.libcamera-name-node ]
  }
]
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
    custom.sp7-libcamera = required
  }
}
# IPU4 capture endpoints require libcamera's complete sensor/ISP pipeline.
# Keep USB cameras and the virtual v4l2loopback devices available.
monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.cap.driver = "intel-ipu6"
        api.v4l2.cap.card = "ipu4p"
      }
    ]
    actions = {
      update-props = { node.disabled = true }
    }
  }
]
