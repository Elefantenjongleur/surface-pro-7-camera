# Surface Pro 7 / Realtek ALC274
#
# WirePlumber/ACP otherwise maps a PipeWire source volume of 100% to the
# hardware mixer and may raise "Internal Mic Boost" from 0 dB to +30 dB.
# This causes severe clipping on the internal microphone.
#
# Keep volume/mute handling in software so that WirePlumber does not modify
# the known-good hardware mixer values set by sp7-audio-fix.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
